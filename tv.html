<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Заказы — Let’s go Coffee Lounge</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Montserrat:wght@800;900&family=Nunito:wght@700;800&display=swap">
<script src="config.js"></script>
<style>
:root{--cream:#f6ebdc;--latte:#ead6bd;--foam:#fbf4e8;--mocha:#7a4a2b;--espresso:#3b2418;--caramel:#c2703d;--gold:#f2cb7c;--green:#1f6b47}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:radial-gradient(70vw 55vh at 92% 0%,rgba(255,190,110,.38),transparent 70%),radial-gradient(60vw 45vh at 0% 100%,rgba(194,112,61,.20),transparent 70%),linear-gradient(160deg,var(--cream),var(--latte));color:var(--espresso);font-family:Nunito,Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.14;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/><feColorMatrix values='0 0 0 0 .3 0 0 0 0 .2 0 0 0 0 .1 0 0 0 .6 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
header{position:relative;background:linear-gradient(180deg,#2e1a10,var(--espresso));padding:5.2vh 2.5vw 1.8vh;display:flex;align-items:center;justify-content:space-between;box-shadow:0 .8vh 2.4vh rgba(40,18,6,.35)}
.garland{position:absolute;left:0;top:0;width:100%;height:4.6vh;pointer-events:none}
.garland svg{position:absolute;inset:0;width:100%;height:100%}
.garland path{fill:none;stroke:#1a0d06;stroke-width:2;vector-effect:non-scaling-stroke}
.bulb{position:absolute;width:1.3vh;height:1.3vh;margin:-.65vh 0 0 -.65vh;border-radius:50%;background:#ffd27a;box-shadow:0 0 1.2vh .5vh rgba(255,170,70,.75);animation:tw 2.8s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.45}}
.brand{display:flex;align-items:center;gap:1.6vw}
.cup{position:relative;font-size:6vh;line-height:1}
.cup i{position:absolute;bottom:80%;width:.45vh;height:2.6vh;border-radius:1vh;background:var(--gold);opacity:0;filter:blur(.25vh);animation:st 3s infinite ease-in}
.cup i:nth-child(1){left:1.2vh}.cup i:nth-child(2){left:2.8vh;animation-delay:1s}.cup i:nth-child(3){left:4.4vh;animation-delay:2s}
@keyframes st{0%{opacity:0;transform:translateY(.8vh)}30%{opacity:.7}100%{opacity:0;transform:translateY(-2.6vh) scaleX(2)}}
.logo{font:900 4vh Montserrat,"Arial Black",sans-serif;color:var(--gold);letter-spacing:.1em;text-transform:uppercase;line-height:1}
.sub{font:700 3.2vh Caveat,cursive;color:#e9cfa6;margin-top:.4vh}
.clock{font:900 5vh Montserrat,sans-serif;color:#fbe9c9}
main{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:2.2vw;padding:2.4vh 2.5vw 6.4vh;min-height:0}
section{border-radius:3vh;padding:1.8vh 1.8vw 2vh;display:flex;flex-direction:column;min-height:0;background:rgba(251,244,232,.82);box-shadow:0 1.2vh 3.2vh rgba(60,30,10,.18);border-top:1.1vh solid;overflow:hidden}
section.cook{border-top-color:var(--caramel)}section.rdy{border-top-color:var(--green)}
h2{margin:0 0 1.6vh;font:700 7vh/1 Caveat,cursive}
.cook h2{color:var(--mocha)}.rdy h2{color:var(--green)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(12vw,1fr));gap:1.6vh 1.2vw;align-content:start;padding-bottom:2vh}
.list.dense{grid-template-columns:repeat(auto-fill,minmax(9vw,1fr));gap:1vh .8vw}
.list.dense .card{padding:.7vh .6vw .8vh}.list.dense .card b{font-size:5.6vh}.list.dense .card span{font-size:2.5vh;margin-top:.3vh}
.card{border-radius:2.2vh;padding:1.2vh .8vw 1.3vh;min-width:0;text-align:center;box-shadow:0 .6vh 1.6vh rgba(60,30,10,.18)}
.card b{display:block;font:900 8.6vh/1 Montserrat,sans-serif}
.card span{display:block;font:800 3.4vh Nunito,sans-serif;margin-top:.7vh;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cook .card{background:var(--latte)}.cook .card b{color:var(--caramel)}.cook .card span{color:var(--espresso)}
.rdy .card{background:var(--green)}.rdy .card b{color:#fff3d6}.rdy .card span{color:#e9f3e4}
.card.new{animation:pulse 1s ease-in-out 8}
@keyframes pulse{50%{transform:scale(1.08);box-shadow:0 0 5vh rgba(255,190,90,.9)}}
.empty{font:700 5vh Caveat,cursive;color:var(--mocha);opacity:.75;padding:1vh 0}
.bar{position:fixed;left:0;right:0;bottom:0;padding:.9vh 2vw;font:700 2vh Nunito,sans-serif;background:rgba(59,36,24,.92);color:#f1dfc3;display:flex;gap:1.5vw;justify-content:space-between;align-items:center}
.bar button{background:var(--caramel);color:#fff8ec;border:0;border-radius:1vh;padding:.7vh 1.4vw;font:800 2vh Nunito,sans-serif;cursor:pointer}
.bar .err{color:#ffb4a0}
@media (max-aspect-ratio:1/1){main{grid-template-columns:1fr}.list{grid-template-columns:repeat(auto-fill,minmax(28vw,1fr))}.logo{font-size:2.4vh}.cup{font-size:4vh}}
</style>
</head>
<body>
<header>
 <div class="garland" id="gl"><svg viewBox="0 0 100 10" preserveAspectRatio="none"><path d="M0 1Q6.25 9 12.5 1T25 1T37.5 1T50 1T62.5 1T75 1T87.5 1T100 1"/></svg></div>
 <div class="brand"><div class="cup">☕<i></i><i></i><i></i></div><div><div class="logo">Let’s go Coffee Lounge</div><div class="sub">кофейня при студии танцев</div></div></div>
 <div class="clock" id="clock"></div>
</header>
<main>
 <section class="cook"><h2>🔥 Готовится</h2><div class="list" id="cook"></div></section>
 <section class="rdy"><h2>✅ Готовы</h2><div class="list" id="rdy"></div></section>
</main>
<div class="bar"><span id="st">Загрузка…</span><span><button id="snd">🔊 Включить звук</button> <button id="fs">⛶ Во весь экран</button></span></div>
<script>
(function(){const g=document.getElementById("gl");for(let i=0;i<8;i++){[[12.5*i+6.25,50],[12.5*(i+1),10]].forEach(function(p,j){if(i==7&&j==1)return;const b=document.createElement("div");b.className="bulb";b.style.left=p[0]+"%";b.style.top=p[1]+"%";b.style.animationDelay=((i*3+j*7)%9)*.3+"s";g.appendChild(b);});}})();

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const URL_=(window.CONFIG&&window.CONFIG.ORDERS_URL)||"";
let seen=new Set(),first=true,audioOn=false,ctx=null;
const two=n=>String(n).padStart(2,"0");
function tick(){const d=new Date();$("clock").textContent=two(d.getHours())+":"+two(d.getMinutes());}
setInterval(tick,1000);tick();
function beep(){if(!audioOn)return;try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();[880,1175].forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;o.connect(g);g.connect(ctx.destination);const t=ctx.currentTime+i*.22;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.3,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.2);o.start(t);o.stop(t+.22);});}catch(e){}}
$("snd").onclick=()=>{audioOn=true;beep();$("snd").style.display="none";};
$("fs").onclick=()=>{const el=document.documentElement;(el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el);};
const cards=(l,newIds)=>l.map(o=>`<div class="card${newIds&&newIds.has(o.id)?" new":""}"><b>${esc(o.id)}</b><span>${esc(o.name)}</span></div>`).join("");
function draw(all){
 const cook=all.filter(o=>o.status=="cooking"),rdy=all.filter(o=>o.status=="ready");
 const fresh=new Set(rdy.filter(o=>!seen.has(o.id)).map(o=>o.id));
 $("cook").innerHTML=cards(cook)||'<div class="empty">Пока нет заказов ☕</div>';
 $("rdy").innerHTML=cards(rdy,first?null:fresh)||'<div class="empty">—</div>';
 $("cook").classList.toggle("dense",cook.length>9);$("rdy").classList.toggle("dense",rdy.length>9);
 if(!first&&fresh.size)beep();
 rdy.forEach(o=>seen.add(o.id));first=false;
}
async function load(){
 if(!URL_){$("st").innerHTML='<span class="err">Адрес заказов не настроен (файл config.js)</span>';return;}
 try{
  const r=await (await fetch(URL_+(URL_.indexOf("?")>-1?"&":"?")+"t="+Date.now(),{cache:"no-store"})).json();
  const now=Date.now();
  draw((r.orders||[]).filter(o=>o.status=="cooking"||(o.status=="ready"&&now-(o.u||now)<30*60000)).sort((a,b)=>(+a.id)-(+b.id)));
  const d=new Date();$("st").textContent="Обновлено "+two(d.getHours())+":"+two(d.getMinutes())+":"+two(d.getSeconds());
 }catch(e){$("st").innerHTML='<span class="err">Нет связи с сервером, пробую снова…</span>';}
}
load();setInterval(load,4000);
try{navigator.wakeLock&&navigator.wakeLock.request("screen").catch(function(){});}catch(e){}

</script>
</body>
</html>
